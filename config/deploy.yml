# Kamal deploy. Fill in image, server, host and registry before the first `kamal setup`.
service: turbo_chat
image: your-user/turbo_chat

servers:
  web:
    - 192.168.0.1

proxy:
  ssl: true
  host: chat.example.com

registry:
  username: your-user
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - SECRET_KEY_BASE
  # Do not set WEB_CONCURRENCY: presence and the async cable adapter live in ONE Puma process.

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

asset_path: /rails/public/assets

builder:
  arch: amd64
