# Branch deploy-teste: EC2 t3.micro de teste na AWS pessoal (us-east-2), subdomínio gratuito do DuckDNS.
# Segredo em ~/.config/turbo_chat (ver .kamal/secrets). `bin/kamal setup` na 1ª vez, `bin/kamal deploy` depois.
service: turbo_chat
image: turbo_chat

servers:
  web:
    - 18.117.133.39

# Let's Encrypt automático; o DNS do domínio precisa apontar para o servidor antes do `kamal setup`.
proxy:
  ssl: true
  host: turbo-chat.duckdns.org
  run:
    log_max_size: "50m"

# Registry local do Kamal: a imagem vai para o servidor por túnel SSH, sem Docker Hub.
registry:
  server: localhost:5555

env:
  secret:
    - SECRET_KEY_BASE
  clear:
    # O kamal-proxy já registra cada requisição; o log do Thruster só duplicava.
    LOG_REQUESTS: false
  # Não defina WEB_CONCURRENCY: a presença e o cable async vivem em UM processo Puma.

# O padrão do Docker (um arquivo de 10 MB) apaga o histórico inteiro ao girar.
logging:
  options:
    max-size: 10m
    max-file: 5

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

# Junta os assets da versão nova e da antiga para requisições em andamento não darem 404.
asset_path: /rails/public/assets

builder:
  arch: amd64

# EC2 com Ubuntu: entra como `ubuntu` (no grupo docker), não como root.
ssh:
  user: ubuntu
  keys: [ "~/.ssh/turbo-chat-aws.pem" ]
